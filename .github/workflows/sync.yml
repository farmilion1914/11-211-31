name: Sync MoySklad to Firebase

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run sync
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: node sync-moysklad.js
